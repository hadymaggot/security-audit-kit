text:
  ? Pengujian dijalankan secara otomatis dan non-destruktif terhadap target yang berwenang diuji. Acuannya OWASP Top 10 2021, OWASP ASVS, dan OWASP Risk Rating Methodology (severity = Likelihood x Impact). Tooling yang digunakan OWASP ZAP, Trivy, dan testssl.sh, ditambah rangkaian regression test untuk access control, upload, dan password policy.
  : Die Tests wurden automatisiert und nicht destruktiv gegen ein Ziel ausgeführt, das für die Prüfung freigegeben ist. Grundlage sind OWASP Top 10 2021, OWASP ASVS und die OWASP Risk Rating Methodology (Severity = Likelihood x Impact). Eingesetzt werden OWASP ZAP, Trivy und testssl.sh sowie eine Reihe von Regressionstests für Access Control, Upload und Password Policy.
  ? Laporan ini merupakan hasil automation, bukan pengganti pentest manual. Temuan scanner (misalnya ZAP) dapat berupa false positive dan wajib diverifikasi sebelum severity final ditetapkan. Celah logika bisnis hanya terdeteksi apabila test-nya ditulis secara khusus. Cakupan pengujian terbatas pada target dan endpoint yang dikonfigurasi saat dijalankan. Uji destruktif (mis. mass-assignment) menulis ke target lalu DIPULIHKAN otomatis ke keadaan semula sebagai fase terakhir setelah laporan ini dibuat; log pemulihan ada di reports/rollback.json, dan `python audit.py rollback` memulihkan ulang bila perlu.
  : Dieser Bericht ist das Ergebnis einer Automatisierung und ersetzt keinen manuellen Pentest. Scanner-Befunde (zum Beispiel ZAP) können False Positives sein und müssen verifiziert werden, bevor die endgültige Severity festgelegt wird. Fehler in der Geschäftslogik werden nur erkannt, wenn dafür ein Test geschrieben wurde. Die Testabdeckung beschränkt sich auf das Ziel und die Endpoints, die für den Lauf konfiguriert wurden. Destruktive Tests (z. B. mass-assignment) schreiben auf das Ziel und werden anschließend als letzte Phase nach Erstellung dieses Berichts automatisch in den Ausgangszustand ZURÜCKGESETZT; das Wiederherstellungsprotokoll steht in reports/rollback.json, und `python audit.py rollback` stellt bei Bedarf erneut wieder her.
  RAHASIA / CONFIDENTIAL: VERTRAULICH / CONFIDENTIAL
  ? Skor CVSS bersifat indikatif (pemetaan kualitatif dari OWASP Risk Rating + vektor v3.1 representatif per jenis temuan); skor+vektor final tetap perlu diverifikasi manual per konteks target.
  : Der CVSS-Score ist indikativ (qualitative Abbildung aus dem OWASP Risk Rating plus ein repräsentativer v3.1-Vektor je Befundtyp); endgültiger Score und Vektor müssen weiterhin manuell für den Zielkontext verifiziert werden.
  'Acuan: OWASP Top 10 2021, OWASP API Security Top 10 2023, OWASP ASVS, OWASP Risk Rating Methodology.': 'Grundlagen: OWASP Top 10 2021, OWASP API Security Top 10 2023, OWASP ASVS, OWASP Risk Rating Methodology.'
