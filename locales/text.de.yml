  ? Tidak ditemukan temuan pada cakupan yang diuji; seluruh kontrol yang diuji berperilaku sesuai harapan. Pemeriksaan yang lolos dirinci pada bagian Kontrol yang Lolos sebagai bukti cakupan uji.
  : Im geprüften Umfang wurden keine Befunde festgestellt; alle geprüften Kontrollen verhielten sich wie erwartet. Die bestandenen Prüfungen sind im Abschnitt Bestandene Kontrollen als Nachweis der Testabdeckung aufgeführt.
