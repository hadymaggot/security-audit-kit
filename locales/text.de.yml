  dibuat oleh: erstellt von
  ? 'Pengujian menemukan {total} instance temuan ({per}) yang tergolong dalam {kinds} jenis alert. Temuan berisiko tertinggi: {top}. Perbaikan disarankan memprioritaskan temuan {priority} terlebih dahulu. Rincian teknis, bukti endpoint, dan rekomendasi tersedia pada bagian Rincian Temuan.'
  : 'Die Tests ergaben {total} Befundinstanzen ({per}), gruppiert in {kinds} Alert-Typen. Befunde mit dem höchsten Risiko: {top}. Bei der Behebung sollten zuerst die Befunde der Stufen {priority} priorisiert werden. Technische Details, Endpoint-Belege und Empfehlungen stehen im Abschnitt Befunddetails.'
  Rincian Temuan: Befunddetails
