text:
  ? Pengujian dijalankan secara otomatis dan non-destruktif terhadap target yang berwenang diuji. Acuannya OWASP Top 10 2021, OWASP ASVS, dan OWASP Risk Rating Methodology (severity = Likelihood x Impact). Tooling yang digunakan OWASP ZAP, Trivy, dan testssl.sh, ditambah rangkaian regression test untuk access control, upload, dan password policy.
  : Testing was run automatically and non-destructively against a target that is authorized for testing. It follows OWASP Top 10 2021, OWASP ASVS, and the OWASP Risk Rating Methodology (severity = Likelihood x Impact). The tooling is OWASP ZAP, Trivy, and testssl.sh, plus a set of regression tests for access control, upload, and password policy.
  ? Laporan ini merupakan hasil automation, bukan pengganti pentest manual. Temuan scanner (misalnya ZAP) dapat berupa false positive dan wajib diverifikasi sebelum severity final ditetapkan. Celah logika bisnis hanya terdeteksi apabila test-nya ditulis secara khusus. Cakupan pengujian terbatas pada target dan endpoint yang dikonfigurasi saat dijalankan. Uji destruktif (mis. mass-assignment) menulis ke target lalu DIPULIHKAN otomatis ke keadaan semula sebagai fase terakhir setelah laporan ini dibuat; log pemulihan ada di reports/rollback.json, dan `python audit.py rollback` memulihkan ulang bila perlu.
  : This report is the result of automation and does not replace a manual pentest. Scanner findings (for example ZAP) can be false positives and must be verified before the final severity is set. Business logic flaws are only detected when a test is written for them. The test coverage is limited to the target and endpoints configured for the run. Destructive tests (e.g. mass-assignment) write to the target and are then RESTORED automatically to the original state as the last phase after this report is built; the restore log is in reports/rollback.json, and `python audit.py rollback` restores again when needed.
  RAHASIA / CONFIDENTIAL: CONFIDENTIAL
  ? Skor CVSS bersifat indikatif (pemetaan kualitatif dari OWASP Risk Rating + vektor v3.1 representatif per jenis temuan); skor+vektor final tetap perlu diverifikasi manual per konteks target.
  : The CVSS score is indicative (a qualitative mapping from the OWASP Risk Rating plus a representative v3.1 vector per finding type); the final score and vector must still be verified manually for the target context.
  'Acuan: OWASP Top 10 2021, OWASP API Security Top 10 2023, OWASP ASVS, OWASP Risk Rating Methodology.': 'References: OWASP Top 10 2021, OWASP API Security Top 10 2023, OWASP ASVS, OWASP Risk Rating Methodology.'
