<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/images/ico2.png" type="image/png">
<title>Contoh laporan — Security Audit Kit</title>
<meta name="description" content="Contoh keluaran laporan Security Audit Kit dalam tiga format: HTML lengkap (standar konsultan), slide presentasi, dan Markdown. Pilih dan lihat langsung.">
<link rel="canonical" href="https://hadymaggot.github.io/security-audit-kit/contoh-laporan.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Contoh laporan — Security Audit Kit">
<meta property="og:description" content="Tiga format laporan: HTML lengkap, slide presentasi, dan Markdown.">
<meta property="og:url" content="https://hadymaggot.github.io/security-audit-kit/contoh-laporan.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
 :root{
   --primary-color:#7AC55A; --secondary-color:#C3DB65; --dark-color:#121212;
   --text-color:#ffffff; --terminal-bg:rgba(18,18,18,.95);
   --mono:'JetBrains Mono',monospace; --sans:'Poppins',sans-serif;
 }
 *{box-sizing:border-box}
 html,body{height:100%}
 /* fit-screen: halaman tidak scroll vertikal; hanya view (kanan) yang boleh scroll */
 body{background-color:var(--dark-color);color:var(--text-color);font-family:var(--sans);margin:0;line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
 a{color:var(--primary-color)}
 .topbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;padding:.7rem 1.2rem;border-bottom:1px solid rgba(122,197,90,.2);background:rgba(18,18,18,.9);font-family:var(--mono);font-size:.85rem;flex:0 0 auto}
 .topbar a{color:var(--primary-color);text-decoration:none} .topbar a:hover{text-decoration:underline}
 .topbar .title{font-weight:600;color:#fff}
 .topbar .crumb{opacity:.7}
 /* dua kolom mengisi sisa tinggi */
 .layout{flex:1 1 auto;display:flex;min-height:0;width:100%;max-width:1600px;margin:0 auto}
 .side{flex:0 0 320px;max-width:42%;overflow:auto;padding:1.2rem;border-right:1px solid rgba(122,197,90,.2)}
 .side h2{font-size:1rem;font-family:var(--mono);color:var(--secondary-color);margin:.2rem 0 1rem}
 .fmt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(122,197,90,.25);border-radius:10px;padding:12px 14px;margin-bottom:.7rem;cursor:pointer;color:var(--text-color);font:inherit;transition:border-color .2s ease,background-color .2s ease}
 .fmt:hover{border-color:var(--primary-color)}
 .fmt.active{border-color:var(--primary-color);background:rgba(122,197,90,.12)}
 .fmt .ic{font-size:1.15rem;color:var(--primary-color)}
 .fmt h3{margin:.35rem 0 .3rem;font-family:var(--mono);font-size:.95rem}
 .fmt p{margin:0;font-size:.85rem;opacity:.85}
 .side .hint{font-size:.8rem;opacity:.7;margin-top:1rem;line-height:1.5}
 /* kolom kanan: header tipis + area view yang mengisi dan scroll internal */
 .view{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
 .view-head{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border-bottom:1px solid rgba(122,197,90,.2);font-family:var(--mono);font-size:.85rem;flex:0 0 auto}
 .view-head .open{margin-left:auto;border:1px solid var(--primary-color);color:var(--primary-color);border-radius:8px;padding:.25rem .7rem;text-decoration:none}
 .view-head .open:hover{background:rgba(122,197,90,.1)}
 .view-body{flex:1 1 auto;min-height:0;position:relative}
 iframe{width:100%;height:100%;border:0;display:block;background:#fff}
 .mdwrap{display:none;position:absolute;inset:0;overflow:auto;padding:1.4rem 1.8rem;background:rgba(255,255,255,.02)}
 #mdbox{line-height:1.8;max-width:860px}
 #mdbox h1{font-size:1.5rem;color:var(--secondary-color)}
 #mdbox h2{font-size:1.25rem;color:var(--secondary-color);border-bottom:1px solid rgba(122,197,90,.2);padding-bottom:.3rem;margin-top:1.8rem}
 #mdbox h3{color:var(--secondary-color)}
 #mdbox code{font-family:var(--mono);background:rgba(122,197,90,.1);padding:1px 5px;border-radius:4px;font-size:.9em}
 #mdbox pre{background:var(--terminal-bg);padding:1rem;border-radius:6px;overflow:auto} #mdbox pre code{background:transparent;padding:0}
 #mdbox table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.92rem} #mdbox th,#mdbox td{border:1px solid rgba(122,197,90,.25);padding:6px 10px;text-align:left;vertical-align:top} #mdbox th{background:rgba(122,197,90,.1)}
 #mdbox a{color:var(--primary-color)} #mdbox blockquote{border-left:3px solid var(--primary-color);margin:0 0 1rem;padding-left:1rem;opacity:.9}
 #mdbox img{max-width:100%} #mdbox hr{border:0;border-top:1px solid rgba(122,197,90,.2);margin:1.5rem 0}
 /* mobile: tumpuk & izinkan scroll halaman */
 @media (max-width:820px){
   body{height:auto;overflow:auto}
   .layout{flex-direction:column;max-width:100%}
   .side{flex:none;max-width:100%;border-right:0;border-bottom:1px solid rgba(122,197,90,.2)}
   .view{min-height:80vh}
   .mdwrap{position:static}
 }
</style>
</head>
<body>
<header class="topbar">
  <a href="https://hadymaggot.github.io/">&larr; Beranda</a>
  <a href="./">Security Audit Kit</a>
  <span class="crumb">&rsaquo; <span class="title">Contoh laporan</span></span>
  <a href="https://github.com/hadymaggot/security-audit-kit" style="margin-left:auto"><i class="fab fa-github"></i> GitHub</a>
</header>

<div class="layout">
  <aside class="side">
    <h2># format laporan</h2>
    <button class="fmt active" data-fmt="html" aria-pressed="true">
      <div class="ic"><i class="fas fa-file-lines"></i></div>
      <h3>HTML lengkap</h3>
      <p>Laporan penuh standar konsultan: executive summary, tiap temuan dengan ID, CVSS indikatif, bukti, dan rekomendasi.</p>
    </button>
    <button class="fmt" data-fmt="slides" aria-pressed="false">
      <div class="ic"><i class="fas fa-display"></i></div>
      <h3>Slide presentasi</h3>
      <p>Ringkasan untuk rapat/manajemen — satu temuan per slide, cocok dipresentasikan.</p>
    </button>
    <button class="fmt" data-fmt="md" aria-pressed="false">
      <div class="ic"><i class="fab fa-markdown"></i></div>
      <h3>Markdown</h3>
      <p>Untuk ditempel ke wiki/issue atau dikonversi ke test. Dirender rapi langsung di halaman.</p>
    </button>
    <p class="hint">Ketiga format dihasilkan oleh <code>python audit.py all</code>. Pratinjau tampil di kanan; gulir di dalam panel untuk melihat keseluruhan.</p>
  </aside>

  <section class="view">
    <div class="view-head">
      <span id="label">HTML lengkap</span>
      <a class="open" id="openLink" href="contoh-laporan-html.html" target="_blank" rel="noopener">Buka di tab baru &nearr;</a>
    </div>
    <div class="view-body">
      <iframe id="frame" title="Pratinjau laporan" src="contoh-laporan-html.html"></iframe>
      <div class="mdwrap" id="mdwrap"><div id="mdbox">Memuat…</div></div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
 var MD_GH = "https://github.com/hadymaggot/security-audit-kit/blob/main/docs/contoh-laporan.md";
 var FMT = {
   html:  {src:"contoh-laporan-html.html",   open:"contoh-laporan-html.html",   label:"HTML lengkap"},
   slides:{src:"contoh-laporan-slides.html", open:"contoh-laporan-slides.html", label:"Slide presentasi"},
   md:    {src:"contoh-laporan.md",          open:MD_GH,                         label:"Markdown"}
 };
 var frame=document.getElementById("frame"), mdwrap=document.getElementById("mdwrap"),
     mdbox=document.getElementById("mdbox"), label=document.getElementById("label"),
     openLink=document.getElementById("openLink");
 var mdLoaded=false;
 function renderMd(){
   if(mdLoaded)return; mdLoaded=true;
   fetch("contoh-laporan.md").then(function(r){return r.text()}).then(function(t){
     if(window.marked&&window.DOMPurify){ mdbox.innerHTML=DOMPurify.sanitize(marked.parse(t)); }
     else{ var pre=document.createElement("pre"); pre.textContent=t; mdbox.innerHTML=""; mdbox.appendChild(pre); }
   }).catch(function(){ mdbox.textContent="Gagal memuat Markdown. Buka di GitHub via tombol di atas."; mdLoaded=false; });
 }
 function pick(k){
   var f=FMT[k]; if(!f)return;
   label.textContent=f.label; openLink.href=f.open;
   if(k==="md"){ frame.style.display="none"; mdwrap.style.display="block"; renderMd(); }
   else{ mdwrap.style.display="none"; frame.style.display="block"; frame.src=f.src; }
   document.querySelectorAll(".fmt").forEach(function(b){var on=b.getAttribute("data-fmt")===k;b.classList.toggle("active",on);b.setAttribute("aria-pressed",on?"true":"false");});
 }
 document.querySelectorAll(".fmt").forEach(function(b){ b.addEventListener("click",function(){pick(b.getAttribute("data-fmt"));}); });
 var q=new URLSearchParams(location.search).get("format");
 if(q&&FMT[q])pick(q);
</script>
</body>
</html>
