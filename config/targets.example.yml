# Salin ke config/targets.yml lalu isi untuk aplikasi yang diuji.
# config/targets.yml di-gitignore — jangan commit base URL internal / kredensial.
#
# Multi-project (paralel): jangan salin manual, buat folder project sendiri per target:
#   python audit.py --project my-app init authz,upload   # -> projects/my-app/config/targets.yml
#   python audit.py --project my-app all                 # config & reports milik project itu
# Nama saja -> <kit>/projects/<nama> (di-gitignore); boleh juga path folder di mana saja.

# Nama bebas untuk laporan.
name: "Contoh Aplikasi"

# Identitas penyusun laporan (opsional). Tampil di laporan HTML/MD/slide pada baris
# "Disusun oleh"; kredit Security Audit Kit tetap tampil di baris "Alat".
# Bisa juga lewat env: SAK_REPORT_AUTHOR, SAK_REPORT_ORG, SAK_REPORT_CONTACT (menimpa nilai di sini).
# report:
#   prepared_by: "Sapto Hadi"                  # default bila tak diisi: Sapto Hadi
#   organization: "PT. Wahana Reka Tekindo"    # default bila tak diisi; isi "" untuk menyembunyikan
#   contact: "wahanarekatekindo@gmail.com"     # default hanya bila perusahaan default; "" = sembunyikan
#   version: "1.0"                             # versi dokumen, default 1.0

# Base URL target. Gunakan dev/staging untuk scanner aktif.
base_url: "https://dev.contoh.local"

# Spesifikasi OpenAPI untuk ZAP API scan (opsional). Boleh URL atau path berkas.
# Banyak framework meng-generate ini otomatis (Scramble, springdoc, drf-spectacular, dll).
openapi: "https://dev.contoh.local/api/docs/openapi.json"

# Host untuk uji TLS & header (tanpa skema).
tls_host: "dev.contoh.local"

# Path yang aman dipukul untuk uji header respons.
header_probe_path: "/"

# Direktori repo kode (untuk scanner statis: trivy, semgrep, gitleaks).
code_path: "."
# Jalankan satu tool per jalan (hemat memori): `python audit.py deps gitleaks|semgrep|trivy`.
# Semgrep di repo besar/bind mount Windows bisa sangat lambat — persempit ke direktori sumber:
# semgrep_paths: ["services/iam/app", "frontend-vue/src"]   # default: seluruh repo
# semgrep_exclude: ["legacy"]                               # tambahan di atas vendor/node_modules/dist/docs
# semgrep_timeout_minutes: 20                               # batas dinding; container dihentikan bila lewat
# Cache DB trivy dipakai bersama semua project (default ~/.cache/sak-trivy). Run trivy dari
# beberapa project sekaligus otomatis diantrekan (kunci berkas); isi folder lain untuk cache terpisah.
# trivy_cache_dir: "~/.cache/sak-trivy"

# Jaringan Docker untuk scanner berbasis container (ZAP, testssl) — OPSIONAL.
# Perlu bila target hanya terjangkau dari jaringan tertentu, terutama target `localhost`:
# di dalam container, `localhost` menunjuk ke container itu sendiri (Connection refused).
# Nilai:
#   "host"                 jaringan host (Docker Desktop: aktifkan host networking)
#   "<nama-jaringan>"      bergabung ke jaringan Docker tertentu (mis. jaringan compose)
#   "container:<nama>"     berbagi network namespace container lain (mis. gateway/proxy
#                          yang melayani base_url) -> `localhost` = container tsb.
# Contoh (target di balik Traefik pada localhost:8080):
# docker_network: "container:app-traefik-1"

# ── Scan AKTIF (ZAP full / api) ───────────────────────────────────────────────────────────
# Scan aktif menulis ke target secara acak sehingga tidak dapat dibalik per tindakan. Rollback yang
# realistis adalah SNAPSHOT DATA: dump sebelum scan, pulihkan sesudahnya (otomatis, juga bila scan
# gagal). Backup yang gagal MEMBATALKAN scan. Entri jurnal dicatat agar `python audit.py rollback`
# dapat memulihkan bila proses mati di tengah jalan.
# Catatan: hanya data yang dicakup langkah snapshot yang dipulihkan (PostgreSQL). MinIO/S3, RabbitMQ,
# dan Redis tidak ikut kecuali Anda menambah langkahnya.
#
# Preset PostgreSQL di Docker:
# snapshot:
#   preset: postgres-docker
#   container: "app-postgres-1"
#   user: "app-user"
#   databases: ["auth", "orders"]   # database yang mungkin berubah oleh scan
#   keep: false                      # hapus berkas snapshot setelah berhasil dipulihkan
#   timeout_seconds: 1800
#
# Atau langkah kustom (argv tanpa shell; {dir} = direktori snapshot):
# snapshot:
#   steps:
#     - name: "mysql app"
#       backup:  { cmd: ["docker","exec","db","mysqldump","-uroot","app"], stdout_to: "{dir}/app.sql" }
#       restore: { cmd: ["docker","exec","-i","db","mysql","-uroot","app"], stdin_from: "{dir}/app.sql" }
#
# Opsi tambahan scan aktif ZAP:
# zap_exclude: [".*/logout.*", ".*/delete.*"]   # regex URL penuh yang dilewati scanner
# zap_spider_minutes: 3                         # -m : lama spider (menit)
# zap_timeout_minutes: 20                       # -T : batas waktu (menit)
