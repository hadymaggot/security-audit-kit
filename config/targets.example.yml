# Copy to config/targets.yml and fill in for the application under test.
# config/targets.yml is gitignored: never commit internal base URLs or credentials.
#
# Multi-project (parallel): do not copy by hand; create a dedicated project folder per target:
#   python audit.py --project my-app init authz,upload   # -> projects/my-app/config/targets.yml
#   python audit.py --project my-app all                 # that project's own config and reports
# A bare name -> <kit>/projects/<name> (gitignored); any folder path also works.

# Free-form name for the report.
name: "Contoh Aplikasi"

# Report preparer identity (optional). Shown in the HTML/MD/slide report on the "Disusun oleh"
# row; the Security Audit Kit credit always stays on the "Alat" row.
# Can also be set via env: SAK_REPORT_AUTHOR, SAK_REPORT_ORG, SAK_REPORT_CONTACT (override values here).
# report:
#   prepared_by: "Sapto Hadi"                  # default when unset: Sapto Hadi
#   organization: "PT. Wahana Reka Tekindo"    # default when unset; use "" to hide
#   contact: "wahanarekatekindo@gmail.com"     # default only when the organization is the default; "" = hide
#   version: "1.0"                             # document version, default 1.0

# Target base URL. Use dev/staging for active scanners.
base_url: "https://dev.contoh.local"

# OpenAPI spec for the ZAP API scan (optional); a URL or a file path.
# Many frameworks generate it automatically (Scramble, springdoc, drf-spectacular, etc.).
openapi: "https://dev.contoh.local/api/docs/openapi.json"

# Host for the TLS and header tests (no scheme).
tls_host: "dev.contoh.local"

# Path that is safe to hit for the response header test.
header_probe_path: "/"

# Code repo directory (for the static scanners: trivy, semgrep, gitleaks).
code_path: "."
# Run one tool per invocation (saves memory): `python audit.py deps gitleaks|semgrep|trivy`.
# Semgrep on a large repo or a Windows bind mount can be very slow; narrow it to source directories:
# semgrep_paths: ["services/iam/app", "frontend-vue/src"]   # default: whole repo
# semgrep_exclude: ["legacy"]                               # on top of vendor/node_modules/dist/docs
# semgrep_timeout_minutes: 20                               # wall-clock limit; the container is killed when exceeded
# The trivy DB cache is shared by all projects (default ~/.cache/sak-trivy). Trivy runs from
# several projects at once are queued automatically (file lock); set another folder for a separate cache.
# trivy_cache_dir: "~/.cache/sak-trivy"

# Docker network for the container-based scanners (ZAP, testssl) - OPTIONAL.
# Needed when the target is only reachable from a specific network, especially a `localhost` target:
# inside a container, `localhost` points at the container itself (Connection refused).
# Values:
#   "host"                 host network (Docker Desktop: enable host networking)
#   "<network-name>"       join a specific Docker network (e.g. the compose network)
#   "container:<name>"     share another container's network namespace (e.g. the gateway/proxy
#                          serving base_url) -> `localhost` is that container.
# Example (target behind Traefik on localhost:8080):
# docker_network: "container:app-traefik-1"

# ── ACTIVE scan (ZAP full / api) ───────────────────────────────────────────────────────────
# An active scan writes to the target at random, so it cannot be undone action by action. The realistic
# rollback is a DATA SNAPSHOT: dump before the scan, restore afterwards (automatic, even if the scan
# fails). A failed backup ABORTS the scan. A journal entry is recorded so `python audit.py rollback`
# can restore if the process dies midway.
# Note: only data covered by a snapshot step is restored (PostgreSQL). MinIO/S3, RabbitMQ and Redis
# are not included unless you add a step for them.
#
# PostgreSQL preset in Docker:
# snapshot:
#   preset: postgres-docker
#   container: "app-postgres-1"
#   user: "app-user"
#   databases: ["auth", "orders"]   # databases the scan may change
#   keep: false                      # delete the snapshot files after a successful restore
#   timeout_seconds: 1800
#
# Or custom steps (argv without a shell; {dir} = snapshot directory):
# snapshot:
#   steps:
#     - name: "mysql app"
#       backup:  { cmd: ["docker","exec","db","mysqldump","-uroot","app"], stdout_to: "{dir}/app.sql" }
#       restore: { cmd: ["docker","exec","-i","db","mysql","-uroot","app"], stdin_from: "{dir}/app.sql" }
#
# Extra ZAP active-scan options:
# zap_exclude: [".*/logout.*", ".*/delete.*"]   # full-URL regexes the scanner skips
# zap_spider_minutes: 3                         # -m : spider duration (minutes)
# zap_timeout_minutes: 20                       # -T : time limit (minutes)
