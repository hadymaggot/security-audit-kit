# Project config for runner.py (the autonomous audit runner). Copy it into your project and adapt it:
#   python runner.py init --config projects/example-app/audit.config.yml
#   python runner.py check --config projects/example-app/audit.config.yml
#   python runner.py run --config projects/example-app/audit.config.yml --target local
#
# Everything that depends on the project lives in this file; runner.py holds no project specific value.
#
# Conventions:
#   - Modules are picked and ordered by `pipeline`. Every module has its settings under `modules`.
#   - `targets: [...]` on a module lists the targets that run it. A module without the target is skipped.
#   - `by_target: { <target>: {...} }` overrides the module settings for one target only.
#   - Passwords and tokens never go in this file. Their source is an env file or a seeder.
#   - "{username}" style values are filled by the runner. "${VAR}" values are passed to the kit as environment variables.
#   - "${env:KEY}", "${repo}", "${work}" and "${sql:QUERY|||REGEX|||FALLBACK}" are expanded in the `stack` section only.

project:
  key: example-app                        # short name used in report file names (default: slug of name)
  name: "Example App"
  language: id                            # report language: id, en or de (default id); --lang overrides it
  # Location of the application repo (absolute, or relative to this file). Reports are copied to <repo>/<output>
  # and the stack steps and env files below are relative to it. Required when this file lives in the kit's
  # projects/ folder (the recommended place: that folder is not committed, like every other kit project).
  repo: /path/to/example-app
  output: docs/security-audit             # relative to the repo; every run gets its own uniquely named folder

# Targets of these levels only run the passive modules listed below (no writes at all).
safety:
  passive_levels: [prod]
  passive_modules: [headers, tls, webstack, openapi-coverage]

# ── application API ───────────────────────────────────────────────────────
api:
  login:
    path: /api/auth/login
    body: { username: "{username}", password: "{password}" }
    token_field: data.accessToken          # dotted path of the access token in the login response
    refresh_field: data.refreshToken
    ttl_field: data.expiresIn
    default_ttl: 3600
  login_probe: { username: sak-probe, password: x }    # invalid login used to read the remaining rate limit quota
  me:
    path: /api/me
    permissions_field: data.permissions    # list of permission codes the account really has
    role_field: data.roleCode
  refresh: { path: /api/auth/refresh, body: { refreshToken: "{refresh_token}" } }
  logout: { path: /api/auth/logout, body: { refreshToken: "{refresh_token}" } }
  change_password:
    path: /api/me/password
    body: { oldPassword: "{old}", newPassword: "{new}", confirmPassword: "{new}" }
  openapi:
    local_url: http://127.0.0.1:3000/openapi.json        # used when the target has no spec of its own

# ── test accounts ─────────────────────────────────────────────────────────
accounts:
  priority: [admin, manager, user]         # picked first when the number of accounts is limited
  low_roles: [user]                        # for modules that need a low privilege user
  strong_roles: [admin]                    # for modules that need a high privilege user
  # Target kind "stack": accounts are read from the database (column 1 = role code, column 2 = username).
  stack:
    query: |
      select r.code, min(u.username) from users u join roles r on r.id = u.role_id
      where u.active and u.username like '%.demo' group by r.code order by 1
    passwords:
      - { users: [admin], file: backend/.env, key: SEED_ADMIN_PASSWORD }
      - { default: true, file: backend/seeds/demo.js, regex: "DEMO_PASSWORD = '([^']+)'" }
  # Target kind "remote": accounts come from the target env file as APP_USER_<ROLE> and APP_PASS_<ROLE>.
  remote:
    user_prefix: APP_USER_
    pass_prefix: APP_PASS_
    ignore: []

# ── local stack (only for targets of kind "stack") ────────────────────────
stack:
  env_file: backend/.env                   # read for ${env:KEY}
  database:
    container: example-postgres
    user_key: POSTGRES_USER
    db_key: POSTGRES_DB
    password_key: POSTGRES_PASSWORD
  secret_keys: [JWT_SECRET, POSTGRES_PASSWORD]       # values added to the leak scan of the report
  # Steps run in order and are idempotent: a healthy service is left alone.
  # Step types: compose, docker_run, node_deps, run, seed_if_empty, process, web.
  up:
    - { type: compose, dir: backend, services: [postgres], wait_healthy: example-postgres }
    - { type: node_deps, dir: backend }
    - { type: run, dir: backend, command: [npm, run, db:migrate], timeout: 900 }
    - type: seed_if_empty
      dir: backend
      check_sql: select count(*) from users
      commands: [[npm, run, "db:seed"]]
    - type: process
      name: api
      dir: backend
      command: [npm, start]
      env: { NODE_ENV: production }
      health_url: http://127.0.0.1:3000/health
      warn_if_running: "The API is already running and is used as it is. Make sure NODE_ENV=production so the rate limit is active."
  # Step types for down: compose_down, docker_rm, process_stop.
  down:
    - { type: compose_down, dir: backend }
    - { type: process_stop, name: api }

# ── targets ───────────────────────────────────────────────────────────────
# kind "stack": the runner starts the stack and tests it. kind "remote": tests a host that already exists.
# Add another target (for example staging) here with kind remote and its own env file.
targets:
  local:
    kind: stack
    base_url: http://localhost:3000
    max_accounts: 15
    healthy: ["http://127.0.0.1:3000/health"]
  dev:
    kind: remote
    env_file: .env.dev                     # next to this config file (or relative to the repo)
    base_url_key: TARGET_BASE_URL
    level_key: TARGET_ENV                  # value: dev, staging or prod
    secret_keys: [BASIC_AUTH_PASS]

# Module order. A module without an active target is skipped and noted in the run summary.
pipeline:
  - deps
  - headers
  - tls
  - webstack
  - cookie-flags
  - authz
  - cors
  - response-leak
  - injection
  - clientleak
  - openapi-coverage
  - open-redirect
  - jwt
  - upload
  - mass-assignment
  - ssrf
  - session
  - auth-policy
  - zap
  - ratelimit

modules:
  deps:
    targets: [local]
    semgrep:
      paths: [src, backend]
      exclude: [node_modules, dist]
      timeout_minutes: 25
    trivy:
      lockfiles: [package.json, package-lock.json]     # trivy scans lockfiles only
  headers: { targets: [local, dev] }
  tls: { targets: [dev] }
  webstack: { targets: [local, dev] }
  cookie-flags:
    targets: [local, dev]
    probe_paths: ["/"]
    httponly_exempt: []
    max_session_days: 30
  authz:
    targets: [local, dev]
    # Expectations are generated from the permissions each account really has ("permissions" = any of).
    # Write endpoints should use a fake id and are only sent to roles that are NOT authorized (read: false).
    endpoints:
      - { name: List users, method: GET, path: /api/users, permissions: [users.read], read: true }
      - { name: Delete user, method: DELETE, path: /api/users/999999, permissions: [users.delete], read: false }
  cors:
    targets: [local, dev]
    user: low
    evil_origin: "https://evil.example"
    paths: [/api/me]
  response-leak:
    targets: [local, dev]
    user: strong
    endpoints:
      - { name: Own profile, path: /api/me }
    allow_keys: []
  injection:
    targets: [local, dev]
    user: strong
    time_based: false
    by_target: { local: { time_based: true } }
    cases:
      - { name: Search (q), method: GET, path: /api/search, location: query, param: q, baseline: test }
  clientleak:
    targets: [local, dev]
    user: strong
    sensitive_paths: [/api/me]
    internal_endpoints: [/api/users]
    auto_discover_js: true
    scan_html: true
  openapi-coverage:
    targets: [local, dev]
    max_requests: 400
    delay_seconds: 0
    public_allowlist: [/api/public/]
  open-redirect:
    targets: [local, dev]
    user: low
    evil_target: "https://evil.example"
    paths: ["/", /login]
    params: [next, url, redirect, return, returnUrl, continue, dest, r]
  jwt:
    targets: [local, dev]
    user: low
    protected: { method: GET, path: /api/me }
    max_lifetime_hours: 24
  upload:
    targets: [local]
    # The owner is an account that owns a data row, so it may upload to it. The query returns (username, entity id).
    owner_query: |
      select u.username, d.id from documents d join users u on u.id = d.owner_id order by d.id limit 1
    endpoint: { method: POST, path: /api/documents, field: file }
    data: { entity: document, entityId: "{entity_id}" }
    allow_only: [".pdf"]
    max_bytes_env: UPLOAD_MAX_SIZE         # key in stack.env_file holding the server upload limit
    cleanup: { method: DELETE, path: "/api/documents/{id}", id_field: data.id }
  mass-assignment:
    targets: [local]
    owner_from: upload                     # reuse the owner query of another module
    prepare_sql: "update users set department = coalesce(department, 'Legal') where username = '{owner}'"
    get_path: /api/me
    update: { method: PUT, path: /api/me }
    data_path: data
    required_fields: [name, phone]         # read from the profile and sent again so validation passes
    forbidden_fields: { roleId: 1, isAdmin: true }
  ssrf:
    targets: [local]
    user: strong
    list: /api/integrations
    item: "/api/integrations/{id}"
    param: apiUrl
    copy_from_item: [code, name, type]
    static: { active: false }
    restore_flag: active
    canary: { port: 18999, public_url: "http://host.docker.internal:18999" }
  session:
    targets: [local]
    create_user:
      path: /api/users
      body: { username: "{username}", password: "{password}", name: Kit Probe, email: "{username}@example.test", roleId: "{role_id}" }
      id_field: data.id
      role_query: "select id from roles where code = 'user'"
    delete_user: { path: "/api/users/{id}" }
    reasonable_ttl_seconds: 3600
  auth-policy:
    targets: [local]
    register:
      path: /api/auth/register
      template: { name: Probe Kit, email: "probe{rand}@example.test" }
      password_field: password
    weak_passwords: ["12345678", password, aaaaaaaa]
  zap:
    targets: [local]
    user: strong
    network: example-net
    internal_base_url: http://example-web
    internal_openapi: http://host.docker.internal:3000/openapi.json
    exclude: [".*/logout.*", ".*/auth/login.*", ".*/auth/refresh.*"]
    spider_minutes: 1
    timeout_minutes: 20
  ratelimit:
    targets: [local, dev]
    burst:
      - { name: Login (fake identity), method: POST, path: /api/auth/login, body: { username: kit-no-such-user, password: Wrong-Wrong-1! }, count: 30 }
