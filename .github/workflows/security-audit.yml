name: Security Audit

# Example pipeline. Static scanners (deps) are safe to run on PRs; DAST tests (zap,
# authz, upload, auth-policy) need a live target, so run them on a schedule against
# dev/staging, never production. Credentials come from GitHub Secrets, not files.

on:
  pull_request:
  schedule:
    - cron: "0 1 * * 1"          # Monday morning
  workflow_dispatch:

jobs:
  static-scan:
    name: SAST + CVE dependensi
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Siapkan config dari contoh
        run: cp config/targets.example.yml config/targets.yml
      - name: Scan dependensi & rahasia (trivy/semgrep/gitleaks via Docker)
        run: python audit.py deps
        # 'deps' is informational; it never fails the build.
      - name: Susun laporan
        run: python audit.py report
      - uses: actions/upload-artifact@v4
        # Artifact storage quota is per account; a full quota must not fail the build.
        continue-on-error: true
        with:
          name: laporan-keamanan
          path: reports/
          retention-days: 14

  dast:
    name: DAST + regresi kontrol akses
    runs-on: self-hosted
    if: github.event_name != 'pull_request'    # needs a live target
    env:
      TARGET_BASE_URL: ${{ secrets.TARGET_BASE_URL }}
      AUTHZ_ADMIN_USER: ${{ secrets.AUTHZ_ADMIN_USER }}
      AUTHZ_ADMIN_PASS: ${{ secrets.AUTHZ_ADMIN_PASS }}
      AUTHZ_USER_USER: ${{ secrets.AUTHZ_USER_USER }}
      AUTHZ_USER_PASS: ${{ secrets.AUTHZ_USER_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Siapkan config dari contoh
        run: |
          cp config/targets.example.yml config/targets.yml
          cp tests/authz-matrix/authz_matrix.example.yml tests/authz-matrix/authz_matrix.yml
      - name: Audit penuh (zap baseline + authz + upload + auth-policy + report)
        run: python audit.py all
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: laporan-dast
          path: reports/
          retention-days: 14
