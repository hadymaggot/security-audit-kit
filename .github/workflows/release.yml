name: Release berkala

# Cek berkala tiap awal bulan; bikin release HANYA kalau ada commit baru sejak tag
# terakhir — biar nggak numpuk tag kosong. Versi SemVer, bump ditentukan dari tipe
# Conventional Commits: feat -> minor, fix/lain -> patch, '!'/BREAKING -> major.
#
# Jalan di self-hosted runner. Release dibuat via REST API (curl + token), bukan gh CLI,
# biar nggak bergantung gh terpasang di runner.
# Catatan: kalau repo ini di-fork & dijalankan di GitHub-hosted, ganti runs-on ke ubuntu-latest.

on:
  schedule:
    - cron: "0 0 1 * *"      # 00:00 UTC tanggal 1 tiap bulan
  workflow_dispatch:          # bisa juga dipicu manual kapan saja

permissions:
  contents: write             # perlu buat push tag & bikin release

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # butuh seluruh history + tag

      - name: Tentukan versi & rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet || true
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)

          if [ -z "$last" ]; then
            next="v1.0.0"                       # rilis pertama
          else
            if [ -z "$(git log "$last"..HEAD --oneline)" ]; then
              echo "Tak ada commit baru sejak $last — lewati."
              exit 0
            fi
            log=$(git log "$last"..HEAD --format='%s%n%b')
            ver=${last#v}
            MA=$(echo "$ver" | cut -d. -f1)
            MI=$(echo "$ver" | cut -d. -f2)
            PA=$(echo "$ver" | cut -d. -f3)
            if echo "$log" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
              MA=$((MA + 1)); MI=0; PA=0
            elif echo "$log" | grep -qE '^feat(\([^)]+\))?:'; then
              MI=$((MI + 1)); PA=0
            else
              PA=$((PA + 1))
            fi
            next="v${MA}.${MI}.${PA}"
          fi

          git tag "$next"
          git push origin "$next"

          # Bikin release + changelog otomatis via REST API (generate_release_notes).
          code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${next}\",\"name\":\"${next}\",\"generate_release_notes\":true}")
          if [ "$code" != "201" ]; then
            echo "Gagal bikin release (HTTP $code):"; cat /tmp/rel.json; exit 1
          fi
          echo "Release ${next} dibuat."
