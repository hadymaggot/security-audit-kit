name: CI

# Gerbang kode tiap PR & push ke main: compile semua Python + jalanin unit test.
# Dijalankan di dalam image python resmi lewat Docker, biar nggak bergantung
# toolchain di self-hosted runner.
# Catatan: kalau repo ini di-fork & dijalankan di GitHub-hosted, ganti runs-on
# ke ubuntu-latest dan boleh pakai actions/setup-python langsung.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile & unit test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: py_compile + pytest (image python resmi)
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.12-slim sh -lc '
            pip install --no-cache-dir -q -r requirements.txt -r requirements-dev.txt &&
            python -m py_compile audit.py report.py remediation.py tests/*/run_*.py &&
            python -m pytest -q tests/unit
          '
