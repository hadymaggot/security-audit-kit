name: CI

# Code gate on every PR and push to main: compile all Python + run unit tests.
# Runs inside the official python image via Docker so it does not depend on the
# self-hosted runner's toolchain.
# Note: if this repo is forked and run on GitHub-hosted runners, change runs-on to
# ubuntu-latest and actions/setup-python can be used directly.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile & unit test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: py_compile + pytest (image python resmi)
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.12-slim sh -lc '
            pip install --no-cache-dir -q -r requirements.txt -r requirements-dev.txt &&
            python -m py_compile audit.py report.py remediation.py tests/_sanctum.py tests/*/run_*.py &&
            python -m pytest -q tests/unit
          '
