# Copy to open_redirect.yml. Non-destructive (GET, redirects not followed).
base_url: "${TARGET_BASE_URL}"

# Optional auth, for endpoints whose redirect sits behind a login.
auth:
  header: "Authorization"
  value: "${OPEN_REDIRECT_TOKEN}"

# External test destination. Change if needed.
evil_target: "https://evil.example"

# Endpoints that may process a redirect parameter.
paths:
  - "/login"
  - "/logout"
  - "/"

# Parameter names to try. The default already covers common ones; override if needed.
params:
  - "next"
  - "url"
  - "redirect"
  - "return"
  - "returnUrl"
  - "continue"
  - "dest"
  - "r"
