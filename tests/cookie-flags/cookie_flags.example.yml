# Copy to cookie_flags.yml. PASSIVE and non-destructive: only reads Set-Cookie headers
# (GET pages, the Sanctum CSRF endpoint, and one login if configured).
base_url: "${TARGET_BASE_URL}"

# Paths to GET in order to capture cookies.
probe_paths: ["/"]

# Optional: log in so SESSION cookies (issued on authentication) are checked too.
# Pass credentials via environment variables; never write them in this file.
# auth:
#   sanctum: { enabled: true, csrf_path: "/sanctum/csrf-cookie", origin: "${TARGET_BASE_URL}" }
#   login: { method: POST, path: "/api/login", body: { email: "${CK_USER}", password: "${CK_PASS}" } }

# Cookies that must be readable by JavaScript (HttpOnly not required).
httponly_exempt: ["XSRF-TOKEN"]

# Require the Secure attribute. Default: automatic (on when base_url is HTTPS).
# require_secure: true

# Maximum lifetime of session/auth cookies (days).
max_session_days: 30
