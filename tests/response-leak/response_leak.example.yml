# Copy to response_leak.yml. PASSIVE: GET only. Sensitive values are NEVER printed to the report
# (only the key path and value length).
base_url: "${TARGET_BASE_URL}"

# Optional: log in so authenticated endpoints are checked too (credentials via env vars).
# auth:
#   sanctum: { enabled: true, csrf_path: "/sanctum/csrf-cookie", origin: "${TARGET_BASE_URL}" }
#   login: { method: POST, path: "/api/login", body: { email: "${RL_USER}", password: "${RL_PASS}" } }
#   # or a static token:  header: "Authorization"  /  value: "${RL_TOKEN}"

# Data endpoints (GET). Do not list login/token endpoints; tokens in their responses are expected.
endpoints:
  - { name: "Profil sendiri", path: "/api/me" }
  # - { name: "Daftar pengguna", path: "/api/users" }
  # - { name: "Katalog publik", path: "/api/public/katalog", anonymous: true }   # no session

# Keys ignored even if they match a sensitive pattern (e.g. column names that are legitimate).
allow_keys: ["csrf_token", "captcha_token"]

# Extra keys treated as sensitive (exact match, lowercase).
# sensitive_keys: ["nik", "no_ktp"]

# Error probes: a random path (404) is checked automatically for verbose error pages; add more paths.
random_404_probe: true
# error_probes: ["/api/users/bukan-id-valid"]

# Check for leaked internal IP addresses (RFC1918) in response bodies.
check_internal_ips: true
