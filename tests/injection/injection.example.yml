# Copy to injection.yml. Non-destructive: read-only (SELECT-style) probing, does not
# modify or delete data. Run only against authorized targets.
base_url: "${TARGET_BASE_URL}"

auth:
  # Static token (Bearer/JWT or a custom header):
  header: "Authorization"
  value: "${TOKEN}"           # e.g. "Bearer xxx"
  # Or Laravel Sanctum (SPA, session cookie); remove header/value above:
  # sanctum: { enabled: true, csrf_path: "/sanctum/csrf-cookie", origin: "${TARGET_BASE_URL}" }
  # login: { method: POST, path: "/api/login", body: { email: "${USER}", password: "${PASS}" } }

options:
  time_based: false            # enable only if needed; adds latency to the target
  time_threshold: 4            # threshold in seconds for time-based detection

targets:
  - name: "Pencarian (param q)"
    method: GET
    path: "/api/products"
    location: query            # query | body | json
    param: "q"
    baseline: "test"           # normal value that returns a valid result
    # extra: { page: 1 }       # other fields that must be sent as well
