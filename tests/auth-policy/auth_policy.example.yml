# Copy to auth_policy.yml. Non-destructive: no brute force, and nothing is saved
# if the template makes the request fail on ANOTHER field (see password_checks).
base_url: "${TARGET_BASE_URL}"

# Optional. On Laravel Sanctum the register endpoint often rejects requests without
# CSRF + a stateful Origin. Enable to send X-XSRF-TOKEN + Origin.
# sanctum:
#   enabled: true
#   csrf_path: "/sanctum/csrf-cookie"
#   origin: "${TARGET_BASE_URL}"     # must match SANCTUM_STATEFUL_DOMAINS

# Optional login session for authenticated checks (e.g. change password).
#   export POLICY_USER=... POLICY_PASS=...   (test account, not a production admin)
# login:
#   method: POST
#   path: "/api/login"
#   body: { email: "${POLICY_USER}", password: "${POLICY_PASS}" }

# Weak password rejected at signup (optional; remove the block if there is no endpoint).
# So that even the strong-password control creates no account, deliberately omit one
# other required field (e.g. privacy consent) from the template.
register:
  path: "/api/auth/register"
  template:
    email: "probe{rand}@example.test"
    name: "probe"
  password_field: "password"
  # confirm_field: "password_confirmation"

# Extra checks (optional). Change password: send a WRONG current_password so nothing
# changes; a weak password must fail on the password field, not current_password.
# password_checks:
#   - name: "ganti sandi"
#     path: "/api/auth/change-password"
#     authenticated: true
#     template: { current_password: "salah-sengaja-probe" }
#     password_field: "password"
#     confirm_field: "password_confirmation"

# Captcha must change on every issue (optional).
captcha:
  issue_path: "/api/captcha"
  token_field: "data.id"

# Include passwords that pass complexity rules but are known leaked (HIBP check).
weak_passwords: ["12345678", "password", "aaaaaaaa", "qwerty12", "11111111", "Password123!"]

# Positive control: a strong password must not get an error on the password field.
# strong_password: "${POLICY_STRONG}"

# Pause between requests (seconds) to avoid rate limits; 429 is recorded as skip.
# delay_seconds: 20
