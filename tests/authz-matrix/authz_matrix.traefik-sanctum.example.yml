# Example authz matrix for a MICROSERVICE stack behind Traefik ForwardAuth,
# with Laravel Sanctum auth (SPA, session cookie based, NOT Bearer/JWT).
#
# Target architecture (common in Laravel + Traefik stacks):
#   - The gateway (Traefik) calls ForwardAuth middleware; downstream services only
#     trust the X-Auth-* headers injected by the gateway and have no auth of their own.
#   - Classic risks: (a) a service is also exposed DIRECTLY on a host port (gateway
#     bypass), (b) the gateway does not overwrite client-sent X-Auth-* (privilege escalation).
#   Both are tested below in ONE run: per-endpoint 'base_url' for the direct service
#   port, and 'forged_headers' as a list of blocks (gateway and bypass).
#
# Copy to authz_matrix.yml, adjust paths and roles. Credentials come from ENV, not here.
#   export AUTHZ_ADMIN_USER=... AUTHZ_ADMIN_PASS=...
#   export AUTHZ_LOW_USER=...   AUTHZ_LOW_PASS=...
#   export SERVICE_DIRECT_URL=http://localhost:<port>   # the published service port

base_url: "${TARGET_BASE_URL}"        # e.g. http://localhost:8080 (via gateway)

auth:
  mode: session_cookie                # keep the session cookie from the login response

  # Enable the Sanctum flow: fetch the CSRF cookie first, send a stateful Origin,
  # then attach X-XSRF-TOKEN automatically on every request.
  sanctum:
    enabled: true
    csrf_path: "/sanctum/csrf-cookie"
    # MUST match SANCTUM_STATEFUL_DOMAINS on the server. Otherwise login returns
    # 500 "Session store not set on request." (treated as a stateless request).
    origin: "${TARGET_BASE_URL}"

  login:
    method: POST
    path: "/api/login"
    body:
      email: "{username}"
      password: "{password}"
    # session_cookie mode needs no token_field; auth is carried by the session cookie.

  roles:
    admin:
      username: "${AUTHZ_ADMIN_USER}"
      password: "${AUTHZ_ADMIN_PASS}"
    low_user:                      # lowest role; must be denied in the admin area
      username: "${AUTHZ_LOW_USER}"
      password: "${AUTHZ_LOW_PASS}"
    anon: { anonymous: true }

endpoints:
  # Admin area: admin only; the low role and anon must be denied.
  - name: "Daftar pengguna (admin only)"
    method: GET
    path: "/api/users"
    expect: { admin: allow, low_user: deny, anon: deny }

  - name: "Kelola peran/permission (admin only)"
    method: GET
    path: "/api/roles"
    expect: { admin: allow, low_user: deny, anon: deny }

  - name: "Log aktivitas (admin only)"
    method: GET
    path: "/api/activity-logs"
    expect: { admin: allow, low_user: deny, anon: deny }

  # IDOR: the low role accessing another entity's object must be denied.
  - name: "IDOR — perusahaan/company lain"
    method: GET
    path: "/api/companies/1"
    expect: { low_user: deny }

  - name: "IDOR — detail laporan milik unit lain"
    method: GET
    path: "/api/reports/1"
    expect: { low_user: deny }

  # Business logic: changing status / approving without authority must be denied.
  - name: "Approve laporan tanpa wewenang"
    method: POST
    path: "/api/reports/1/approve"
    body: { note: "probe" }
    expect: { low_user: deny }

  # Gateway bypass: per-endpoint 'base_url' points DIRECTLY at the service port
  # (no Traefik/ForwardAuth). Anon without any header must still be denied.
  - name: "Area admin langsung ke service (tanpa gateway)"
    method: GET
    path: "/api/admin/settings"
    base_url: "${SERVICE_DIRECT_URL}"   # e.g. http://localhost:<service-port>
    expect: { anon: deny }

# Forged-header test: one block, or a list of blocks as below.
# Admin endpoints MUST still deny. If they get through, the downstream service
# trusts client-sent X-Auth-* headers as-is.
forged_headers:
  # 1) Via the gateway as the low role: ForwardAuth must overwrite X-Auth-*.
  - as_role: low_user
    inject:
      X-Auth-Roles: "admin"
      X-Auth-User-Id: "1"
      X-Auth-Permissions: "users.read,users.write"
    endpoints:
      - { method: GET, path: "/api/users" }
      - { method: GET, path: "/api/roles" }
  # 2) Gateway bypass: anonymous + forged admin identity straight to the service port.
  #    A service that reads X-Auth-* without verification gets through here.
  - as_role: anon
    base_url: "${SERVICE_DIRECT_URL}"   # applies to all endpoints in this block
    inject:
      X-Auth-Roles: "admin"
      X-Auth-User-Id: "1"
      X-Auth-Company-Id: ""
    endpoints:
      - { method: GET, path: "/api/admin/settings" }
      # Per-endpoint base_url overrides the block's, e.g. another service:
      - { method: GET, path: "/api/notifications/templates", base_url: "${SERVICE2_DIRECT_URL}" }
