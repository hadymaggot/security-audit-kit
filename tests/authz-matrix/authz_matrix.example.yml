# Access control matrix, the core of this kit.
# Copy to authz_matrix.yml and adjust. Keep credentials out of this file;
# use ${ENV_VAR} placeholders read from the environment.
#
# Idea: for each endpoint, state which roles MAY access it (expect allow) and which
# MUST BE DENIED (expect deny). The runner logs in as each role and checks that
# reality matches. An access control flaw is a "deny" that gets through.

base_url: "${TARGET_BASE_URL}"

# How each role logs in and how the token/session is obtained.
auth:
  # Mode: "session_cookie" (keep cookies from the login response) or
  #       "bearer" (read the token from the JSON response, send as Authorization: Bearer).
  mode: bearer

  login:
    method: POST
    path: "/api/auth/login"
    # Body fields are sent as JSON.
    body:
      email: "{username}"
      password: "{password}"
    # Bearer mode: simple dotted path to the token in the response.
    token_field: "data.token"

  # Roles under test. Credentials come from env vars.
  roles:
    admin:
      username: "${AUTHZ_ADMIN_USER}"
      password: "${AUTHZ_ADMIN_PASS}"
    regular_user:
      username: "${AUTHZ_USER_USER}"
      password: "${AUTHZ_USER_PASS}"
    # Pseudo-role "anon" does not log in; tests routes that must reject unauthenticated requests.
    anon: { anonymous: true }

# Status handling:
#   allow = expect 2xx/3xx
#   deny  = expect 401 or 403 (NOT 404/500; those are flagged for review)
endpoints:
  - name: "Daftar pengguna (admin only)"
    method: GET
    path: "/api/users"
    expect:
      admin: allow
      regular_user: deny
      anon: deny

  - name: "Ubah peran pengguna (admin only)"
    method: POST
    path: "/api/users/1/role"
    body: { role: "viewer" }
    expect:
      admin: allow
      regular_user: deny
      anon: deny

  # IDOR: regular_user accessing an object id owned by another account must be denied.
  - name: "IDOR — detail akun lain"
    method: GET
    path: "/api/accounts/999"
    expect:
      regular_user: deny

  # Business logic / status jump: write per case to match the app flow.
  - name: "Lompat status tanpa peran berwenang"
    method: POST
    path: "/api/documents/1/status"
    body: { status: "approved" }
    expect:
      regular_user: deny

# Optional: the client injects forged authorization headers; the gateway must overwrite them.
# Useful when the architecture relies on a reverse proxy setting internal X-Auth-* headers.
forged_headers:
  enabled: true
  # Log in as this low role, then inject the headers below; endpoints must still deny.
  as_role: regular_user
  inject:
    X-Auth-Roles: "admin"
    X-Auth-User-Id: "1"
  endpoints:
    - { method: GET, path: "/api/users" }

# Optional screenshot evidence (off by default). When enabled, each broken-access finding
# (unauthorized role gets HTTP 2xx on GET) is captured as a PNG via headless Chromium using
# that role's headers/cookies, and embedded in the report and slides.
# Needs: pip install playwright && python -m playwright install chromium (no-op if missing).
screenshot:
  enabled: false
  full_page: false
