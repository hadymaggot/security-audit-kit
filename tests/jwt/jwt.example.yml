# Copy to jwt.yml. Only for APIs that use JWT. The token comes from a legitimate login (or an env var);
# forgery probes only call the protected GET endpoint you specify.
base_url: "${TARGET_BASE_URL}"

# Token source: pick one.
login:
  method: POST
  path: "/api/login"
  body: { email: "${JWT_USER}", password: "${JWT_PASS}" }
  token_path: "data.token"          # where the token sits in the JSON response
# token: "${JWT_TOKEN}"            # or a token straight from an environment variable

# Protected endpoint that accepts the token (must return 2xx for the genuine token).
protected: { method: GET, path: "/api/me" }

# How the token is sent.
auth_header: "Authorization"
auth_prefix: "Bearer "
# cookie: "token"                  # if the token is sent via cookie instead of a header

# Reasonable token lifetime limit (hours) and an extra wordlist for the offline weak HS secret check.
max_lifetime_hours: 24
# weak_secrets: ["nama-perusahaan", "app-key-lama"]
# wordlist_file: "wordlist.txt"
