# Salin ke ratelimit.yml. Menguji kontrol anti brute-force: rate limit, lockout akun, enumerasi akun.
# Lockout HANYA diuji pada AKUN UJI SEKALI PAKAI yang dibuat lalu dihapus lewat API admin (blok
# `fixture`) — akun nyata tidak pernah dikunci. Kredensial admin lewat environment variable.
base_url: "${TARGET_BASE_URL}"

# 1) Rate limit: kirim `count` request cepat; harus muncul HTTP 429 / Retry-After.
burst:
  - name: "Login (identitas fiktif)"
    method: POST
    path: "/api/login"
    body: { email: "kit-tidak-ada@contoh.example", password: "Salah-Salah-1!" }
    count: 20
    # sanctum: true             # untuk target Sanctum SPA (cookie + CSRF)
    # origin: "${TARGET_BASE_URL}"

# Jeda setelah burst agar kuota rate limit gateway pulih sebelum fixture login (detik).
pause_after_burst_seconds: 0

# 2) Fixture akun uji sekali pakai (wajib bila lockout/enumerasi diuji).
fixture:
  admin_auth:
    sanctum: { enabled: true, csrf_path: "/sanctum/csrf-cookie", origin: "${TARGET_BASE_URL}" }
    login: { method: POST, path: "/api/login", body: { email: "${RL_ADMIN_USER}", password: "${RL_ADMIN_PASS}" } }
  email_template: "kit-probe-{rand}@contoh.example"
  create:
    method: POST
    path: "/api/users"
    body:
      name: "Kit Probe {rand}"
      email: "{email}"
      password: "{password}"
      password_confirmation: "{password}"
      status: "active"
      roles: ["peran-rendah"]
    id_path: "data.id"
  delete: { method: DELETE, path: "/api/users/{id}" }
  login: { method: POST, path: "/api/login", body: { email: "{email}", password: "{password}" } }

# 3) Kebijakan lockout yang diharapkan.
lockout:
  enabled: true
  max_attempts: 5                 # ambang gagal sebelum akun terkunci
  tolerance: 1
  delay_seconds: 0.5              # jeda antar percobaan (naikkan bila gateway punya rate limit login)
  lock_statuses: [423]            # status yang menandakan akun terkunci
  lock_message_regex: "dikunci|terkunci|locked|too many failed"
  max_lock_minutes: 60            # durasi kunci wajar (kunci selamanya dianggap berlebihan)
  wrong_password: "Salah-Salah-1!"
  enumeration_check: true         # bandingkan respons akun terdaftar vs fiktif
