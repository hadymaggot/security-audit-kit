# Copy to ratelimit.yml. Tests anti brute-force controls: rate limit, account lockout, account enumeration.
# Lockout is ONLY tested on a DISPOSABLE test account created and deleted via the admin API (the
# `fixture` block); real accounts are never locked. Admin credentials come from environment variables.
base_url: "${TARGET_BASE_URL}"

# 1) Rate limit: send `count` rapid requests; HTTP 429 / Retry-After must appear.
burst:
  - name: "Login (identitas fiktif)"
    method: POST
    path: "/api/login"
    body: { email: "kit-tidak-ada@contoh.example", password: "Salah-Salah-1!" }
    count: 20
    # sanctum: true             # for Sanctum SPA targets (cookie + CSRF)
    # origin: "${TARGET_BASE_URL}"

# Pause after the burst so the gateway rate limit quota recovers before the login fixture (seconds).
pause_after_burst_seconds: 0

# 2) Disposable test account fixture (required when lockout/enumeration is tested).
fixture:
  admin_auth:
    sanctum: { enabled: true, csrf_path: "/sanctum/csrf-cookie", origin: "${TARGET_BASE_URL}" }
    login: { method: POST, path: "/api/login", body: { email: "${RL_ADMIN_USER}", password: "${RL_ADMIN_PASS}" } }
  email_template: "kit-probe-{rand}@contoh.example"
  create:
    method: POST
    path: "/api/users"
    body:
      name: "Kit Probe {rand}"
      email: "{email}"
      password: "{password}"
      password_confirmation: "{password}"
      status: "active"
      roles: ["peran-rendah"]
    id_path: "data.id"
  delete: { method: DELETE, path: "/api/users/{id}" }
  login: { method: POST, path: "/api/login", body: { email: "{email}", password: "{password}" } }

# 3) Expected lockout policy.
lockout:
  enabled: true
  max_attempts: 5                 # failed attempts before the account locks
  tolerance: 1
  delay_seconds: 0.5              # delay between attempts (raise if the gateway rate limits login)
  lock_statuses: [423]            # statuses that indicate a locked account
  lock_message_regex: "dikunci|terkunci|locked|too many failed"
  max_lock_minutes: 60            # reasonable lock duration (a permanent lock is considered excessive)
  wrong_password: "Salah-Salah-1!"
  enumeration_check: true         # compare registered vs fake account responses
