# Copy to ssrf.yml. LOCAL-CANARY SSRF test: the module runs an HTTP listener of your own,
# sends the canary URL to endpoints that accept a URL, and checks whether the target server fetches it.
# No internal host scanning and no cloud metadata calls.
base_url: "${TARGET_BASE_URL}"

# Optional: authentication if the endpoint needs login (credentials via env var).
# auth:
#   sanctum: { enabled: true, csrf_path: "/sanctum/csrf-cookie", origin: "${TARGET_BASE_URL}" }
#   login: { method: POST, path: "/api/login", body: { email: "${SSRF_USER}", password: "${SSRF_PASS}" } }
#   # or a static token:  header: "Authorization"  /  value: "${SSRF_TOKEN}"

# Canary listener. `public_url` = the listener address AS SEEN FROM THE TARGET SERVER
# (e.g. host.docker.internal for a target in Docker on the same machine, or your LAN IP).
callback:
  bind: "0.0.0.0"
  port: 18999
  public_url: "http://host.docker.internal:18999"
  wait_seconds: 4

# Try bypass variants (decimal/hex/octal IP, userinfo '@', redirect).
variants: true

# Endpoints that ACCEPT a URL (webhook, link preview, import from URL, etc.).
targets:
  - name: "Pratinjau tautan"
    method: POST
    path: "/api/link-preview"
    param: "url"
    location: json            # query | json | form
    # extra: { type: "article" }
