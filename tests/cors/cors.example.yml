# Copy to cors.yml. Non-destructive (GET with a test Origin header only).
base_url: "${TARGET_BASE_URL}"

# Optional: include auth so credentialed endpoints are tested too.
auth:
  header: "Authorization"
  value: "${CORS_TOKEN}"          # e.g. "Bearer xxx"

# Foreign origin used to test reflection. Change if needed.
evil_origin: "https://evil.example"

# Endpoints to check; prefer APIs that return data.
paths:
  - "/api/users/me"
  - "/api/profile"
  - "/api/"
