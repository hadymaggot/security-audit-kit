# Copy to openapi_coverage.yml. Non-destructive: only ANONYMOUS GET requests are sent;
# write operations (POST/PUT/PATCH/DELETE) are analyzed statically and never sent.

# OpenAPI 3.x spec: URL or file path (JSON/YAML).
# Many frameworks generate it (Laravel Scramble: /docs/api.json, springdoc, drf-spectacular).
openapi: "${TARGET_BASE_URL}/docs/api.json"

# API prefix to call. Empty -> uses servers[0].url from the spec.
base_url: "${TARGET_BASE_URL}/api"

# Multiple specs at once (e.g. per microservice); overrides the values above:
# specs:
#   - { name: "iam",  openapi: "http://127.0.0.1:18001/docs/api.json", base_url: "http://127.0.0.1:18001/api" }
#   - { name: "core", openapi: "http://127.0.0.1:18002/docs/api.json", base_url: "http://127.0.0.1:18002/api" }

# Endpoints that are intentionally public (matches if the path CONTAINS the text). The default
# already covers login, register, captcha, forgot/reset-password, health, docs, csrf-cookie, etc.
# public_allowlist: ["/login", "/captcha", "/public/"]

# Values for path parameters ({id} etc.). Default: a 26-zero placeholder (enough for auth tests).
# path_params: { id: "00000000000000000000000000" }

# Request cap and delay between requests (seconds), to avoid triggering rate limits.
max_requests: 400
delay_seconds: 0
