# Salin ke session_mgmt.yml. Menguji pencabutan sesi (logout dan ganti sandi) pada AKUN UJI
# SEKALI PAKAI yang dibuat lalu dihapus lewat API admin (blok `fixture`). Akun nyata tak tersentuh.
base_url: "${TARGET_BASE_URL}"

fixture:
  admin_auth:
    sanctum: { enabled: true, csrf_path: "/sanctum/csrf-cookie", origin: "${TARGET_BASE_URL}" }
    login: { method: POST, path: "/api/login", body: { email: "${SM_ADMIN_USER}", password: "${SM_ADMIN_PASS}" } }
  email_template: "kit-probe-{rand}@contoh.example"
  create:
    method: POST
    path: "/api/users"
    body:
      name: "Kit Probe {rand}"
      email: "{email}"
      password: "{password}"
      password_confirmation: "{password}"
      status: "active"
      roles: ["peran-rendah"]
    id_path: "data.id"
  delete: { method: DELETE, path: "/api/users/{id}" }
  login: { method: POST, path: "/api/login", body: { email: "{email}", password: "{password}" } }

session:
  me_path: "/api/me"                         # endpoint ter-autentikasi untuk memeriksa sesi hidup
  delay_seconds: 0                           # jeda antar login (naikkan bila kena rate limit login)
  logout: { method: POST, path: "/api/logout" }
  change_password:
    method: POST
    path: "/api/auth/change-password"
    body:
      current_password: "{password}"
      password: "{new_password}"
      password_confirmation: "{new_password}"
