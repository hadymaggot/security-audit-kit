# Copy to captcha.yml. STATIC analysis of the captcha challenge (GET); it does not solve
# or submit captcha answers. Checks whether the response already leaks the answer.
base_url: "${TARGET_BASE_URL}"

endpoint: { method: GET, path: "/api/captcha" }

# Where the challenge object sits in the JSON response (leave empty if at the root).
data_path: "data"

# Number of challenges to fetch (to check target position randomness). Captcha endpoints
# are usually rate limited; raise delay_seconds if needed.
samples: 2
delay_seconds: 0
