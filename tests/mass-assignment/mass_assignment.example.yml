# Copy to mass_assignment.yml. Credentials come from env vars.
#
# DESTRUCTIVE but REVERSIBLE: every write is recorded in the rollback journal and
# restored AUTOMATICALLY as the last phase after the report is built. To restore
# again manually: `python audit.py rollback`.
#
# Use a LOW-privilege account and an object it OWNS and is allowed to modify.
#   export MA_USER=... MA_PASS=...
base_url: "${TARGET_BASE_URL}"
auth:
  # Laravel Sanctum (SPA, session cookie). For a static token, use:
  #   header: "Authorization"
  #   value: "${MA_TOKEN}"   # e.g. "Bearer xxx"
  sanctum:
    enabled: true
    csrf_path: "/sanctum/csrf-cookie"
    origin: "${TARGET_BASE_URL}"   # must match SANCTUM_STATEFUL_DOMAINS
  login:
    method: POST
    path: "/api/login"
    body: { email: "${MA_USER}", password: "${MA_PASS}" }

targets:
  - name: "Eskalasi role via update profil sendiri"
    get:    { path: "/api/me" }          # read to snapshot the original values
    data_path: "data"                     # where the object sits in the JSON response (optional)
    update: { method: PATCH, path: "/api/me" }
    inject: { role: "admin", is_admin: true }   # forbidden fields to try
    fields: ["role", "is_admin"]          # fields to snapshot and restore
