# Recon module config: copy to recon.yml and adjust.
# Run: python audit.py recon            (uses the values in this file)
#  or: python audit.py recon contoh.example -m owasp --active
#
# Only for targets you own or are authorized to test.

# Target domain/host. May be left empty if base_url is set (the host is derived from it).
target: "contoh.example"
base_url: "https://contoh.example"

# Phase depth:
#   osint : subfinder -> dnsx -> httpx                 (non-intrusive)
#   infra : + naabu (port scan)                        (ACTIVE, see gating)
#   full  : + nuclei (vuln scan)                       (ACTIVE, see gating)
depth: "infra"

# Nuclei mode (only relevant at depth full):
#   fast | stealth | full | owasp
mode: "fast"

# Intrusive phase gating. ALL off by default: port scan/nuclei/crawl/fuzz do not run
# unless enabled: true AND the tool's own toggle is true (or use --active on the CLI).
active:
  enabled: false
  naabu: false     # port scan (infra/full)
  nuclei: false    # vuln scan (full)
  katana: false    # crawl to expand URLs before nuclei (full)
  ffuf: false      # content discovery / path fuzzing (full)

# Secret scan (trufflehog) of local source. Passive; only runs when set.
code_path: ""              # e.g. "." for the current repo

# Wordlist for ffuf (required if active.ffuf: true).
ffuf_wordlist: ""          # e.g. "/usr/share/seclists/Discovery/Web-Content/common.txt"

# Override binary names/paths if not on PATH (optional).
tools:
  subfinder: "subfinder"
  amass: "amass"
  dnsx: "dnsx"
  httpx: "httpx"
  naabu: "naabu"
  nuclei: "nuclei"
  gau: "gau"
  waybackurls: "waybackurls"
  katana: "katana"
  ffuf: "ffuf"
  trufflehog: "trufflehog"

# Timeout per tool (seconds).
timeout: 600

# Optional subfinder passive-source API keys via environment variable, not in this file:
#   export PDCP_API_KEY=...   then reference it as ${PDCP_API_KEY} if needed.
